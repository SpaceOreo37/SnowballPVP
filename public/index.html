<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snowball Fight</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
        #gameCanvas {
            width: 100vw;
            height: 100vh;
        }
        #healthDisplay {
            position: absolute;
            bottom: 70px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-family: Arial, sans-serif;
            font-size: 20px;
            background-color: rgba(0, 0, 0, 0.5);
            padding: 10px;
            border-radius: 5px;
            width: 400px;
            text-align: center;
        }
        #healthBar {
            width: 100%;
            height: 40px;
            background-color: #444;
            border-radius: 10px;
            margin-top: 5px;
            overflow: hidden;
            border: 2px solid white;
        }
        #healthBarFill {
            width: 100%;
            height: 100%;
            background-color: #2ecc71;
            transition: width 0.3s ease-out;
        }
        #deathOverlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 0, 0, 0.6);
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            color: white;
            font-family: Arial, sans-serif;
            z-index: 1000;
        }
        #respawnTimer {
            font-size: 48px;
            margin-bottom: 20px;
        }
        #deathMessage {
            font-size: 24px;
            margin-bottom: 20px;
        }
        #respawnProgress {
            width: 300px;
            height: 20px;
            background-color: rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }
        #respawnProgressFill {
            width: 100%;
            height: 100%;
            background-color: white;
            transform-origin: left;
            transition: transform 0.1s linear;
        }
        #instructions {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: rgba(0, 0, 0, 0.5);
            padding: 10px;
            border-radius: 5px;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 24px;
            pointer-events: none;
            user-select: none;
        }
        #clickToStart {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-family: Arial, sans-serif;
            font-size: 24px;
            background-color: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
        }
        #snowballMeter {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: rgba(0, 0, 0, 0.5);
            padding: 15px;
            border-radius: 8px;
            width: 300px;
        }
        #snowballCount {
            color: white;
            font-family: Arial, sans-serif;
            font-size: 24px;
            margin-bottom: 10px;
            text-align: center;
        }
        #reloadProgress {
            height: 30px;
            background-color: #444;
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid #666;
        }
        #reloadProgressFill {
            height: 100%;
            background-color: #3498db;
            width: 100%;
            transition: width 0.2s ease-out, background-color 0.3s ease;
        }
    </style>
</head>
<body>
    <div id="healthDisplay">
        <span id="healthText">100/100</span>
        <div id="healthBar">
            <div id="healthBarFill"></div>
        </div>
    </div>
    <div id="deathOverlay">
        <div id="respawnTimer">3</div>
        <div id="deathMessage">Respawning in:</div>
        <div id="respawnProgress">
            <div id="respawnProgressFill"></div>
        </div>
    </div>
    <div id="crosshair">+</div>
    <div id="clickToStart">Click to Play</div>
    <div id="instructions">
        WASD to move | Mouse to look | Click to throw snowballs | R to reload
    </div>
    <div id="snowballMeter">
        <div id="snowballCount">10/10</div>
        <div id="reloadProgress"></div>
    </div>
    <script src="/socket.io/socket.io.js"></script>
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "cannon-es": "https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js"
        }
    }
    </script>
    <script type="module" src="game.js"></script>
</body>
</html>
