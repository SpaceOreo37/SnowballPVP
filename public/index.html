<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snowball Fight</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap');

        :root {
            --primary-red: #DB073D;
            --primary-yellow: #DBA507;
            --primary-blue: #8EC7D2;
            --secondary-blue: #0D6986;
            --dark-blue: #07485B;
            --bg-overlay: rgba(7, 72, 91, 0.85);
        }

        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Rajdhani', sans-serif;
        }

        #gameCanvas {
            width: 100vw;
            height: 100vh;
        }

        /* Main HUD Bar */
        #hudBar {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            width: 900px;
            height: 120px;
            background: var(--bg-overlay);
            border: 2px solid var(--primary-blue);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            box-shadow: 0 0 20px rgba(142, 199, 210, 0.2);
        }

        .hudSection {
            display: flex;
            flex-direction: column;
            gap: 25px;
            width: 300px;
        }

        .hudSection.middle {
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .hudSection.right {
            align-items: flex-end;
        }

        /* Health Display */
        #healthDisplay, #sprintDisplay, #snowballMeter, #dashDisplay {
            width: 100%;
            position: relative;
            margin-top: 10px;
        }

        #healthText, #sprintText, #snowballCount, #dashText {
            position: absolute;
            top: -25px;
            color: var(--primary-blue);
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 1px;
        }

        #healthText, #sprintText {
            left: 0;
        }

        #snowballCount, #dashText {
            right: 0;
        }

        #healthBar, #sprintBar, #reloadProgress, #dashBar {
            width: 100%;
            height: 12px;
            border-radius: 6px;
            overflow: hidden;
            border: none;
            position: relative;
        }

        #healthBar {
            background-color: rgba(219, 7, 61, 0.3);
        }

        #sprintBar {
            background-color: rgba(219, 165, 7, 0.3);
        }

        #reloadProgress {
            background-color: rgba(13, 105, 134, 0.3);
        }

        #dashBar {
            background-color: rgba(142, 199, 210, 0.3);
        }

        #healthBarFill {
            background: var(--primary-red);
        }

        #sprintBarFill {
            background: var(--primary-yellow);
        }

        #reloadProgressFill {
            background: linear-gradient(90deg, var(--secondary-blue) 0%, var(--primary-blue) 100%);
        }

        #dashBarFill {
            background: var(--primary-blue);
        }

        #healthBarFill, #sprintBarFill, #reloadProgressFill, #dashBarFill {
            height: 100%;
            transition: width 0.3s ease-out;
            position: relative;
        }

        #coordinateDisplay {
            color: var(--primary-blue);
            font-size: 20px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(142, 199, 210, 0.5);
            text-align: center;
            margin-bottom: 5px;
        }

        #killCounter {
            color: var(--primary-red);
            font-size: 18px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-align: center;
        }

        /* Game Log Styling */
        #gameLog {
            position: fixed;
            top: 20px;
            left: 20px;
            width: 350px;
            background: var(--bg-overlay);
            border: 2px solid var(--primary-blue);
            border-radius: 8px;
            color: var(--primary-blue);
            font-family: 'Rajdhani', sans-serif;
            overflow: hidden;
        }

        .gameLogHeader {
            background: rgba(142, 199, 210, 0.1);
            padding: 10px 15px;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            border-bottom: 2px solid var(--primary-blue);
        }

        .gameLogContent {
            padding: 15px;
            max-height: 200px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .gameLogContent::-webkit-scrollbar {
            width: 6px;
        }

        .gameLogContent::-webkit-scrollbar-track {
            background: rgba(142, 199, 210, 0.1);
        }

        .gameLogContent::-webkit-scrollbar-thumb {
            background: var(--primary-blue);
            border-radius: 3px;
        }

        .gameLogEntry {
            margin: 0;
            padding: 10px 15px;
            background: rgba(142, 199, 210, 0.05);
            border-radius: 4px;
            font-size: 14px;
            letter-spacing: 0.5px;
            line-height: 1.4;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
        }

        .gameLogEntry.kill {
            background: rgba(219, 7, 61, 0.1);
            color: var(--primary-red);
            border-left: 3px solid var(--primary-red);
        }

        .gameLogEntry.join {
            background: rgba(219, 165, 7, 0.1);
            color: var(--primary-yellow);
            border-left: 3px solid var(--primary-yellow);
        }

        .gameLogEntry.leave {
            background: rgba(13, 105, 134, 0.1);
            color: var(--secondary-blue);
            border-left: 3px solid var(--secondary-blue);
        }

        /* Abilities Section */
        #abilitiesSection {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .ability {
            width: 50px;
            height: 50px;
            background: rgba(142, 199, 210, 0.1);
            border: 2px solid var(--primary-blue);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary-blue);
            font-size: 16px;
            font-weight: 600;
            position: relative;
        }

        .ability::before {
            content: attr(data-key);
            position: absolute;
            bottom: -20px;
            font-size: 12px;
            color: var(--primary-blue);
            text-transform: uppercase;
        }

        .ability::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: var(--primary-blue);
            transform-origin: left;
            transform: scaleX(var(--cooldown-progress, 1));
            transition: transform 0.1s linear;
        }

        .ability.cooldown {
            opacity: 0.5;
        }

        .ability.cooldown::after {
            background: var(--secondary-blue);
        }

        /* Crosshair */
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: var(--primary-blue);
            font-size: 24px;
            pointer-events: none;
            user-select: none;
            text-shadow: 0 0 10px rgba(142, 199, 210, 0.5);
        }

        /* Death Overlay */
        #deathOverlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(219, 7, 61, 0.3) 0%, rgba(7, 72, 91, 0.8) 100%);
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 1000;
        }

        #respawnTimer {
            font-size: 72px;
            font-weight: 700;
            color: var(--primary-blue);
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(142, 199, 210, 0.5);
        }

        #deathMessage {
            font-size: 24px;
            color: var(--primary-blue);
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        #respawnProgress {
            width: 300px;
            height: 4px;
            background: rgba(142, 199, 210, 0.2);
            border-radius: 2px;
            overflow: hidden;
        }

        #respawnProgressFill {
            height: 100%;
            background: var(--primary-blue);
            transform-origin: left;
            transition: transform 0.1s linear;
        }

        /* Chat and Leaderboard */
        #leaderboard {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--bg-overlay);
            border: 2px solid var(--primary-blue);
            border-radius: 8px;
            padding: 15px;
            color: var(--primary-blue);
            font-family: 'Rajdhani', sans-serif;
            min-width: 250px;
            z-index: 1000;
            display: block;
        }

        #leaderboard h2 {
            font-size: 24px;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 0 0 15px 0;
            padding-bottom: 10px;
            border-bottom: 2px solid rgba(142, 199, 210, 0.2);
            text-align: center;
            color: var(--primary-blue);
        }

        .leaderboardEntry {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            margin-bottom: 8px;
            background: rgba(142, 199, 210, 0.05);
            border-radius: 4px;
            transition: background-color 0.2s ease;
            font-size: 16px;
            letter-spacing: 0.5px;
        }

        .leaderboardEntry:last-child {
            margin-bottom: 0;
        }

        .leaderboardEntry.self {
            background: rgba(219, 165, 7, 0.1);
            border-left: 3px solid var(--primary-yellow);
        }

        .leaderboardEntry.empty {
            opacity: 0.5;
            background: rgba(142, 199, 210, 0.02);
            color: rgba(142, 199, 210, 0.5);
        }

        .leaderboardEntry.first {
            background: rgba(255, 215, 0, 0.1);
            border-left: 3px solid #FFD700;
        }

        #leaderboardList {
            margin-bottom: 15px;
            min-height: 120px;
        }

        #personalStats {
            margin-top: 15px;
            padding-top: 10px;
            border-top: 2px solid rgba(142, 199, 210, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: var(--primary-blue);
        }

        #personalKillCount {
            font-size: 18px;
            font-weight: bold;
            color: var(--primary-yellow);
        }

        /* Animations */
        @keyframes healthPulse {
            0% { transform: translateX(-100%); }
            50% { transform: translateX(100%); }
            100% { transform: translateX(100%); }
        }

        /* Instructions */
        #instructions {
            position: fixed;
            bottom: 180px;
            left: 50%;
            transform: translateX(-50%);
            color: var(--primary-blue);
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            background: rgba(11, 75, 107, 0.5);
            padding: 10px;
            border-radius: 5px;
        }

        /* Title Screen */
        #titleScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, var(--secondary-blue) 0%, var(--dark-blue) 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 2000;
        }

        #gameTitle {
            font-size: 82px;
            font-weight: 700;
            color: var(--primary-blue);
            margin-bottom: 40px;
            text-transform: uppercase;
            letter-spacing: 4px;
            text-shadow: 0 0 30px rgba(142, 199, 210, 0.5);
        }

        #nameInput {
            width: 300px;
            height: 50px;
            background: rgba(142, 199, 210, 0.1);
            border: 2px solid var(--primary-blue);
            border-radius: 8px;
            color: var(--primary-blue);
            font-family: 'Rajdhani', sans-serif;
            font-size: 20px;
            text-align: center;
            margin-bottom: 20px;
            outline: none;
            transition: all 0.3s ease;
        }

        #nameInput:focus {
            background: rgba(142, 199, 210, 0.2);
            box-shadow: 0 0 20px rgba(142, 199, 210, 0.3);
        }

        #nameInput::placeholder {
            color: rgba(142, 199, 210, 0.5);
        }

        #playButton {
            width: 200px;
            height: 50px;
            background: var(--primary-blue);
            border: none;
            border-radius: 8px;
            color: var(--dark-blue);
            font-family: 'Rajdhani', sans-serif;
            font-size: 20px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        #playButton:hover {
            background: var(--secondary-blue);
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(142, 199, 210, 0.3);
        }

        #credits {
            position: absolute;
            bottom: 20px;
            color: var(--primary-blue);
            font-size: 16px;
            letter-spacing: 1px;
        }

        /* Pause Menu */
        #pauseMenu {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, var(--bg-overlay) 0%, rgba(7, 72, 91, 0.95) 100%);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            backdrop-filter: blur(5px);
        }

        #pauseMenuContent {
            background: rgba(13, 105, 134, 0.3);
            padding: 40px;
            border-radius: 12px;
            border: 2px solid var(--primary-blue);
            text-align: center;
            min-width: 300px;
            box-shadow: 0 0 30px rgba(142, 199, 210, 0.2);
        }

        #pauseMenuContent h2 {
            color: var(--primary-blue);
            font-family: 'Rajdhani', sans-serif;
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(142, 199, 210, 0.5);
        }

        .pauseMenuButton {
            display: block;
            width: 200px;
            margin: 15px auto;
            padding: 12px;
            background: rgba(142, 199, 210, 0.1);
            color: var(--primary-blue);
            border: 2px solid var(--primary-blue);
            border-radius: 6px;
            font-family: 'Rajdhani', sans-serif;
            font-size: 18px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .pauseMenuButton:hover {
            background: var(--primary-blue);
            color: var(--dark-blue);
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(142, 199, 210, 0.3);
        }

        #exitButton {
            border-color: var(--primary-red);
            color: var(--primary-red);
        }

        #exitButton:hover {
            background: var(--primary-red);
            color: white;
        }

        /* Remove old sprint and dash meter styles */
        #sprintMeter, #dashMeter {
            display: none;
        }

        .metersContainer {
            display: none;
        }
    </style>
</head>
<body>
    <div id="pauseMenu">
        <div id="pauseMenuContent">
            <h2>Game Paused</h2>
            <button id="resumeButton" class="pauseMenuButton">Resume Game</button>
            <button id="exitButton" class="pauseMenuButton">Exit to Main Menu</button>
        </div>
    </div>

    <div id="titleScreen">
        <a target="_blank" href="https://jam.pieter.com" style="font-family: 'system-ui', sans-serif; position: fixed; bottom: -1px; right: -1px; padding: 7px; font-size: 14px; font-weight: bold; background: #fff; color: #000; text-decoration: none; z-index: 10; border-top-left-radius: 12px; z-index: 10000; border: 1px solid #fff;">🕹️ Vibe Jam 2025</a>
        <h1 id="gameTitle">Snowball PvP</h1>
        <input type="text" id="nameInput" placeholder="Enter your name" maxlength="20">
        <button id="playButton">Play</button>
        <div id="credits">Created by Ranbir Gill</div>
    </div>

    <div id="hudBar">
        <div class="hudSection left">
            <div id="healthDisplay">
                <span id="healthText">100/100</span>
                <div id="healthBar">
                    <div id="healthBarFill"></div>
                </div>
            </div>
            
            <div id="sprintDisplay">
                <span id="sprintText">SPRINT</span>
                <div id="sprintBar">
                    <div id="sprintBarFill"></div>
                </div>
            </div>
        </div>

        <div class="hudSection middle">
            <div id="coordinateDisplay">X: 0 Y: 0</div>
            <div id="killCounter">Kills: 0</div>
        </div>

        <div class="hudSection right">
            <div id="snowballMeter">
                <span id="snowballCount">10/10</span>
                <div id="reloadProgress">
                    <div id="reloadProgressFill"></div>
                </div>
            </div>

            <div id="dashDisplay">
                <span id="dashText">DASH</span>
                <div id="dashBar">
                    <div id="dashBarFill"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="gameLog">
        <div class="gameLogHeader">KILL FEED</div>
        <div class="gameLogContent"></div>
    </div>

    <div id="deathOverlay">
        <div id="respawnTimer">3</div>
        <div id="deathMessage">Respawning</div>
        <div id="respawnProgress">
            <div id="respawnProgressFill"></div>
        </div>
    </div>

    <div id="crosshair">+</div>
    <div id="instructions">
        WASD to move | Mouse to look | Click to throw | R to reload | E to sprint | Q to dash
    </div>

    <div id="leaderboard">
        <h2>Leaderboard</h2>
        <div id="leaderboardList">
            <!-- Leaderboard entries will be dynamically added here -->
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "cannon-es": "https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js"
        }
    }
    </script>
    <script type="module" src="game.js"></script>
</body>
</html>
